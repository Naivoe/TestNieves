<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virgen de las Nieves · Alquiler de trineos, esquí y snowboard en Hoya de la Mora, Sierra Nevada</title>
<meta name="description" content="Alquiler de trineos, esquí, snowboard y ropa de nieve en Hoya de la Mora, Sierra Nevada (Granada). Reserva online y recoge tu equipo listo en la caseta. Pagas al recoger.">
<meta property="og:title" content="Virgen de las Nieves · Alquiler de trineos y esquí en Hoya de la Mora">
<meta property="og:description" content="Tu equipo listo antes de que llegues a la nieve. Reserva online, pagas al recoger.">
<meta property="og:locale" content="es_ES">
<meta property="og:locale:alternate" content="en_GB">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Instrument+Serif:ital@1&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F6FA}
a{color:#0B4DCC}a:hover{color:#082F7A}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,122,26,.6)}50%{box-shadow:0 0 0 9px rgba(255,122,26,0)}}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.track{display:flex;width:max-content;animation:marquee 38s linear infinite}
.dot{animation:pulse 2.2s ease-out infinite}
@supports (animation-timeline: view()){.reveal{animation:rise linear both;animation-timeline:view();animation-range:entry 0% cover 28%}}
@media (prefers-reduced-motion: reduce){.track,.dot,.reveal{animation:none}}
.pill:hover{background:#26324A;color:#FFFFFF}
.pill-o:hover{background:#0B1220;color:#FFFFFF}
.glass-link:hover{background:rgba(255,255,255,.16);color:#FFFFFF}
.sbtn:hover{background:rgba(11,18,32,.08)}
.tab:hover{border-color:#0B1220}
.pcard{transition:transform .25s ease}
.pcard:hover{transform:translateY(-6px) rotate(-.4deg)}
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:240px;gap:16px}
.span2{grid-column:span 2}.row2{grid-row:span 2}
@media (max-width: 900px){.nav-links{display:none !important}}
@media (max-width: 860px){.bento{grid-template-columns:minmax(0,1fr);grid-auto-rows:auto}.span2{grid-column:auto}.row2{grid-row:auto}.bento > *{min-height:220px}}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
details[open] .faq-plus{transform:rotate(45deg)}
button:disabled{opacity:.45;cursor:not-allowed}
@keyframes waPulse{0%{box-shadow:0 0 0 0 rgba(21,128,61,.55)}70%{box-shadow:0 0 0 18px rgba(21,128,61,0)}100%{box-shadow:0 0 0 0 rgba(21,128,61,0)}}
@keyframes waIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
.wa-bubble{animation:waIn .35s ease-out both}
.wa-btn{opacity:.92;transition:opacity .25s ease, background .25s ease}
.wa-btn:hover,.wa-btn:focus-visible{opacity:1;background:#166534;color:#FFFFFF}
.wa-label{display:inline-block;max-width:0;overflow:hidden;white-space:nowrap;opacity:0;transition:max-width .35s ease, opacity .25s ease, margin .35s ease}
.wa-btn:hover .wa-label,.wa-btn:focus-visible .wa-label{max-width:220px;opacity:1;margin:0 6px 0 8px}
@media (prefers-reduced-motion: reduce){.wa-bubble{animation:none}.wa-label{transition:none}}
</style>

</head>
<body>
<div id="app"></div>
<template id="tpl-es">
<div style="font-family: Inter, system-ui, sans-serif; color: #0B1220; background: #F5F6FA; padding: 0 12px">

<!-- ============ NAV FLOTANTE ============ -->
<header style="position: sticky; top: 12px; z-index: 30; max-width: 1240px; margin: 0 auto; padding: 0 12px">
<div style="margin-top: 12px; min-height: 64px; padding: 8px 8px 8px 18px; box-sizing: border-box; border-radius: 999px; background: rgba(11,18,32,0.55); backdrop-filter: blur(16px) saturate(1.4); border: 1px solid rgba(255,255,255,0.18); color: #FFFFFF; display: flex; flex-wrap: nowrap; align-items: center; justify-content: space-between; gap: 10px">
<a href="#inicio" style="display: flex; align-items: center; gap: 10px; color: #FFFFFF; text-decoration: none">
<svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="16" fill="#FFFFFF"></circle><path d="M6 22 L13 11 L17 17 L20 13 L26 22 Z" fill="#0B4DCC"></path><path d="M13 11 L15.2 14.4 L14 14 L13 15 L11.8 14 L11 14.4 Z" fill="#FFFFFF"></path></svg>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: -0.02em">Virgen de las Nieves</span>
</a>
<nav class="nav-links" aria-label="Principal" style="display: flex; flex-wrap: wrap; gap: 4px; font-size: 14px; font-weight: 500">
<a class="glass-link" href="#tienda" style="padding: 10px 14px; border-radius: 999px; color: #FFFFFF; text-decoration: none">Alquilar</a>
<a class="glass-link" href="#ventajas" style="padding: 10px 14px; border-radius: 999px; color: #FFFFFF; text-decoration: none">Ventajas</a>
<a class="glass-link" href="#quienes-somos" style="padding: 10px 14px; border-radius: 999px; color: #FFFFFF; text-decoration: none">Quiénes somos</a>
<a class="glass-link" href="#donde" style="padding: 10px 14px; border-radius: 999px; color: #FFFFFF; text-decoration: none">Dónde estamos</a>
<a class="glass-link" href="#faq" style="padding: 10px 14px; border-radius: 999px; color: #FFFFFF; text-decoration: none">Preguntas</a>
</nav>
<span style="display: flex; align-items: center; gap: 8px; flex: none"><span role="group" aria-label="Idioma / Language" style="display: inline-flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.3); flex: none"><button type="button" lang="es" aria-pressed="true" aria-label="Español" style="min-width: 40px; height: 36px; padding: 0 10px; border: 0; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; cursor: pointer; background: #FFFFFF; color: #0B1220">ES</button><button type="button" lang="en" aria-pressed="false" aria-label="English" onclick="__setLang('en')" style="min-width: 40px; height: 36px; padding: 0 10px; border: 0; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; cursor: pointer; background: transparent; color: #FFFFFF">EN</button></span><dc-island><a href="#carrito" style="display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 8px 0 18px; border-radius: 999px; background: #FFFFFF; color: #0B1220; text-decoration: none; font-weight: 700; font-size: 15px">
Reservar
<span style="min-width: 32px; height: 32px; padding: 0 8px; box-sizing: border-box; border-radius: 999px; background: #FF7A1A; color: #0B1220; display: inline-flex; align-items: center; justify-content: center; font-size: 14px">{{ cartCount }}</span>
</a></dc-island></span>
</div>
</header>

<!-- ============ HERO ============ -->
<section id="inicio" style="position: relative; height: 920px; margin: -100px -12px 0; border-radius: 0; overflow: hidden; color: #FFFFFF; background: #0B4DCC">
<img src="{{ heroImg }}" alt="La caseta de Virgen de las Nieves en Hoya de la Mora, con trineos de colores sobre la nieve" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{ imgPos }}">
<div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,47,122,0.35) 0%, rgba(8,47,122,0) 45%, rgba(11,18,32,0) 70%, rgba(11,18,32,0.35) 100%)"></div>
<canvas ref="{{ setCanvas }}" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none"></canvas>

<div style="position: relative; z-index: 3; max-width: 1240px; height: 100%; margin: 0 auto; padding: 150px 24px 28px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 22px">
<a href="#ventajas" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; padding: 9px 16px 9px 12px; border-radius: 999px; background: rgba(255,255,255,0.16); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.3); color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 600">
<span class="dot" style="width: 10px; height: 10px; border-radius: 50%; background: #FF7A1A"></span>
{{ heroBadge }}
</a>
<h1 style="margin: 0; max-width: 980px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(54px, 7.6vw, 124px); line-height: 0.9; letter-spacing: -0.045em">Tu equipo listo antes de que llegues <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; letter-spacing: -0.02em">a la nieve.</span></h1>
<p style="margin: 0; max-width: 520px; font-size: 19px; line-height: 1.5; color: #FFFFFF; text-shadow: 0 1px 12px rgba(8,47,122,0.5)">Trineos, esquí y snowboard en Hoya de la Mora, en plena nieve. Reserva online y recógelo listo. Sin colas.</p>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<span style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: rgba(11,18,32,0.55); backdrop-filter: blur(10px); font-size: 14px; font-weight: 600">Trineos desde <strong style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px">10 €</strong></span>
<span style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: rgba(11,18,32,0.55); backdrop-filter: blur(10px); font-size: 14px; font-weight: 600">Sin mínimo de antelación</span>
</div>
<!-- Reserva rápida -->
<dc-island><form aria-label="Reserva rápida" style="flex: 0 1 560px; display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; padding: 8px; border-radius: 26px; background: rgba(255,255,255,0.82); backdrop-filter: blur(18px) saturate(1.3); color: #0B1220; box-shadow: 0 30px 60px rgba(11,18,32,0.25)">
<div style="flex: 1 1 170px; display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 8px 14px; border-radius: 18px; background: #FFFFFF">
<label for="q-fecha" style="font-size: 12px; font-weight: 600; color: #556070">Primer día</label>
<input id="q-fecha" type="date" min="{{ today }}" value="{{ date }}" onChange="{{ setDate }}" style="border: 0; padding: 0; min-height: 30px; font: inherit; font-size: 16px; font-weight: 600; color: #0B1220; background: transparent">
</div>
<div style="flex: 0 1 150px; display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 8px 6px 8px 14px; border-radius: 18px; background: #FFFFFF">
<span style="font-size: 12px; font-weight: 600; color: #556070">Días</span>
<span style="display: flex; align-items: center; justify-content: space-between">
<button type="button" class="sbtn" onClick="{{ decDays }}" aria-label="Un día menos" style="width: 44px; height: 36px; border: 0; border-radius: 10px; background: transparent; font-size: 20px; font-weight: 700; color: #0B1220; cursor: pointer">−</button>
<span style="font-weight: 700; font-size: 17px">{{ days }}</span>
<button type="button" class="sbtn" onClick="{{ incDays }}" aria-label="Un día más" style="width: 44px; height: 36px; border: 0; border-radius: 10px; background: transparent; font-size: 20px; font-weight: 700; color: #0B1220; cursor: pointer">+</button>
</span>
</div>
<a class="pill" href="#tienda" style="flex: 1 1 160px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 60px; padding: 0 22px; border-radius: 18px; background: #0B1220; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 16px">Ver material
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</a>
<sc-if value="{{ showPromo }}" hint-placeholder-val="{{ false }}"><p aria-live="polite" style="flex: 1 1 100%; margin: 0; padding: 4px 12px 6px; font-size: 13px; color: #26324A">{{ earlyText }}</p></sc-if>
</form></dc-island>
</div>
</div>
</section>

<!-- ============ CINTA ============ -->
<div aria-hidden="true" style="overflow: hidden; margin: 0 -12px; border-radius: 0; background: #0B1220; color: #FFFFFF; padding: 22px 0">
<div class="track">
<sc-for list="{{ marquee }}" as="m" hint-placeholder-count="14">
<span style="display: inline-flex; align-items: center; gap: 28px; padding-right: 28px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 40px; letter-spacing: -0.03em; white-space: nowrap">{{ m.t }}<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FF7A1A" stroke-width="2.4" stroke-linecap="round"><path d="M12 2v20M2 12h20M5 5l14 14M19 5 5 19"></path></svg></span>
</sc-for>
</div>
</div>

<!-- ============ BENTO: RESERVA ANTICIPADA ============ -->
<section id="ventajas" style="max-width: 1240px; margin: 0 auto; padding: 96px 12px 24px">
<div class="reveal" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 32px">
<h2 style="margin: 0; max-width: 760px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(44px, 5vw, 72px); line-height: 0.95; letter-spacing: -0.04em">Reserva online, <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400">sin sorpresas.</span></h2>
<p style="margin: 0; max-width: 380px; font-size: 17px; line-height: 1.55; color: #556070">Eliges desde casa, tu equipo te espera apartado con tu nombre y llegas directo a la nieve.</p>
</div>
<div class="bento">
<div class="reveal span2 row2" style="border-radius: 28px; background: #FF7A1A; color: #0B1220; padding: 32px; display: flex; flex-direction: column; justify-content: space-between; gap: 20px">
<sc-if value="{{ showPromo }}" hint-placeholder-val="{{ false }}">
<div style="height: 100%; display: flex; flex-direction: column; justify-content: space-between; gap: 20px">
<span style="font-size: 15px; font-weight: 700">Reserva anticipada</span>
<div>
<p style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(110px, 14vw, 200px); line-height: 0.8; letter-spacing: -0.06em">−{{ pct }}%</p>
<p style="margin: 16px 0 0; font-size: 20px; font-weight: 600; max-width: 420px">reservando con {{ minDays }} días o más de antelación. Se aplica solo, sin códigos.</p>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 18px; border-radius: 18px; background: rgba(11,18,32,0.1)">
<span style="font-size: 15px">Familia de 4 · 3 días · gama media</span>
<strong style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; letter-spacing: -0.02em">Ahorras {{ familySaving }}</strong>
</div>
</div>
</sc-if>
<sc-if value="{{ noPromo }}" hint-placeholder-val="{{ true }}">
<div style="height: 100%; display: flex; flex-direction: column; justify-content: space-between; gap: 20px">
<span style="font-size: 15px; font-weight: 700">Reserva online</span>
<div>
<p style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(88px, 11vw, 160px); line-height: 0.82; letter-spacing: -0.06em">Sin colas.</p>
<p style="margin: 16px 0 0; font-size: 20px; font-weight: 600; max-width: 440px">Reserva desde el móvil en un minuto y recoge tu equipo listo en la caseta.</p>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 18px; border-radius: 18px; background: rgba(11,18,32,0.1)">
<span style="font-size: 15px">Hasta el mismo día</span>
<strong style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; letter-spacing: -0.02em">Pagas al recoger</strong>
</div>
</div>
</sc-if>
</div>
<div class="reveal span2" style="position: relative; border-radius: 28px; overflow: hidden; background: #DCE6F5">
<img src="{{ heroImg }}" alt="Trineos de colores clavados en la nieve junto a la caseta" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 8% 72%; transform: scale(1.6); transform-origin: 8% 72%">
<span style="position: absolute; left: 16px; bottom: 16px; padding: 10px 16px; border-radius: 999px; background: rgba(255,255,255,0.9); backdrop-filter: blur(8px); font-size: 14px; font-weight: 700">En plena nieve · Hoya de la Mora</span>
</div>
<div class="reveal" style="border-radius: 28px; background: #0B4DCC; color: #FFFFFF; padding: 26px; display: flex; flex-direction: column; justify-content: space-between">
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"></path><path d="m9 12 2 2 4-4"></path></svg>
<div><h3 style="margin: 0 0 6px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; letter-spacing: -0.03em">Tu talla, asegurada</h3><p style="margin: 0; font-size: 15px; line-height: 1.5; color: #DCE6FF">Apartada con tu nombre en puentes y Navidad.</p></div>
</div>
<div class="reveal" style="border-radius: 28px; background: #FFD23F; color: #0B1220; padding: 26px; display: flex; flex-direction: column; justify-content: space-between">
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0B1220" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg>
<div><h3 style="margin: 0 0 6px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; letter-spacing: -0.03em">Recogida exprés</h3><p style="margin: 0; font-size: 15px; line-height: 1.5; color: #3A3320">Enseñas tu código y en minutos estás en la nieve.</p></div>
</div>
</div>
</section>

<!-- ============ TIENDA ============ -->
<section id="tienda" style="max-width: 1240px; margin: 0 auto; padding: 96px 12px 40px">
<div class="reveal" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 28px">
<div>
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(44px, 5vw, 72px); line-height: 0.95; letter-spacing: -0.04em">Elige <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400">y a jugar.</span></h2>
<p style="margin: 10px 0 0; font-size: 15px; color: #556070">Precio por persona y día, IVA incluido. <strong style="color: #8A4B00">[Precios de ejemplo salvo el trineo: confirmar]</strong></p>
</div>
<div role="group" aria-label="Filtrar material" style="display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E3E6EE">
<dc-island><sc-for list="{{ tabs }}" as="t" hint-placeholder-count="6">
<button type="button" class="tab" onClick="{{ t.pick }}" aria-pressed="{{ t.pressed }}" style="{{ t.style }}">{{ t.label }}</button>
</sc-for></dc-island>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<div style="flex: 999 1 600px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px">
<dc-island><sc-for list="{{ products }}" as="p" hint-placeholder-count="6">
<article class="pcard" style="{{ p.cardStyle }}">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px">
<span style="padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,0.75); font-size: 12px; font-weight: 700">{{ p.badge }}</span>
<span style="{{ p.iconWrap }}">
<sc-if value="{{ p.isSled }}" hint-placeholder-val="{{ false }}"><svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 30h28c4 0 6-3 6-6"></path><path d="M10 30c-3 0-4-3-2-5l6-9h18l4 9"></path><path d="M16 30v6M30 30v6M8 38h32"></path></svg></sc-if>
<sc-if value="{{ p.isSki }}" hint-placeholder-val="{{ false }}"><svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 42 36 6M20 42 42 10"></path><path d="M8 40l6 3M16 40l6 3"></path></svg></sc-if>
<sc-if value="{{ p.isSnow }}" hint-placeholder-val="{{ false }}"><svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="19" y="3" width="10" height="42" rx="5" transform="rotate(35 24 24)"></rect><path d="M18 20l5 2M24 28l5 2"></path></svg></sc-if>
<sc-if value="{{ p.isKid }}" hint-placeholder-val="{{ false }}"><svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="12" r="6"></circle><path d="M14 44V30l-4-6 6-5h16l6 5-4 6v14"></path></svg></sc-if>
<sc-if value="{{ p.isExtra }}" hint-placeholder-val="{{ false }}"><svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 30a16 16 0 0 1 32 0v4H8z"></path><path d="M24 14v8M14 34v4h20v-4"></path></svg></sc-if>
</span>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px; margin-top: 22px">
<h3 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05">{{ p.name }}</h3>

</div>

<sc-if value="{{ p.isSnow }}" hint-placeholder-val="{{ false }}"><svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="19" y="3" width="10" height="42" rx="5" transform="rotate(35 24 24)"></rect><path d="M18 20l5 2M24 28l5 2"></path></svg></sc-if>

<sc-if value="{{ p.isExtra }}" hint-placeholder-val="{{ false }}"><svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 30a16 16 0 0 1 32 0v4H8z"></path><path d="M24 14v8M14 34v4h20v-4"></path></svg></sc-if>

<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px; margin-top: 22px">
